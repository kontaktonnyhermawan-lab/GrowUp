<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrowUp">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;GrowUp&quot;,&quot;short_name&quot;:&quot;GrowUp&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#ffffff&quot;,&quot;theme_color&quot;:&quot;#7c3aed&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%237c3aed' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='central'>📅</text></svg>&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;,&quot;purpose&quot;:&quot;any&quot;}]}">
<title>GrowUp – Smart Parenting App</title>
<style>
:root{
  --primary:#7c3aed;--primary-dark:#6d28d9;--primary-light:#ede9fe;
  --white:#ffffff;--bg:#f0f4ff;--text:#1a1d2e;--text-soft:#64748b;
  --border:#e2e8f0;--success:#22c55e;--shadow:0 4px 20px rgba(0,0,0,0.07);
  --radius:22px;--radius-sm:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;padding:0;font-family:'Nunito',sans-serif}
body{background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.app-container{height:100vh;display:flex;flex-direction:column;max-width:100vw;overflow:hidden}
.app-content{flex:1;overflow-y:auto;padding:14px;overflow-x:hidden}
.app-content::-webkit-scrollbar{width:6px}
.app-content::-webkit-scrollbar-track{background:#f1f5f9}
.app-content::-webkit-scrollbar-thumb{background:#c4b5fd;border-radius:3px}

.topbar{background:white;border-radius:0;padding:14px;margin:-14px -14px 14px -14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.brand-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--white);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:active{transform:scale(0.95)}

.card{background:var(--white);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:none}
.card-title{font-weight:900;font-size:15px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-around;gap:8px}
.stat-box{flex:1;text-align:center;padding:12px;background:var(--primary-light);border-radius:10px;border:2px solid var(--primary)}
.stat-num{font-size:24px;font-weight:900;color:var(--primary)}
.stat-label{font-size:10px;color:var(--text-soft);font-weight:700;margin-top:2px}

.profile-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.profile-row::-webkit-scrollbar{height:4px}
.profile-chip{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:60px;padding:6px;border-radius:10px;transition:all .2s}
.profile-chip:active{transform:scale(0.95)}
.profile-avatar{width:48px;height:48px;border-radius:12px;background:var(--primary-light);border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .2s}
.profile-chip.active .profile-avatar{border-color:var(--primary);box-shadow:0 3px 10px rgba(124,58,237,0.3)}
.profile-name{font-size:11px;font-weight:700;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.act-card{background:var(--white);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;border:2px solid var(--border);transition:all .15s}
.act-card:active{transform:scale(0.98)}
.act-card.done{background:linear-gradient(135deg,#f0fdf4,#f0fdf4);border-color:var(--success)}
.act-emoji{font-size:24px}
.act-info{flex:1}
.act-name{font-weight:800;font-size:14px;color:var(--text)}
.act-card.done .act-name{text-decoration:line-through;color:var(--success)}
.act-time{font-size:11px;color:var(--text-soft);margin-top:2px}
.check-btn{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--border);background:var(--white);cursor:pointer;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;flex-shrink:0}
.check-btn:active{transform:scale(0.9)}
.check-btn.done{background:var(--success);border-color:var(--success);color:white}

.bottom-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;padding:12px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito';transition:all .2s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white}
.btn-secondary{background:var(--white);color:var(--text-soft);border:2px solid var(--border)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;z-index:1000;animation:fadeIn 0.2s}
.modal-backdrop.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:var(--white);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:100vw;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:900;margin-bottom:16px;color:var(--text)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:900;color:var(--text-soft);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Nunito';outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,0.1)}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.modal-footer button{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-weight:800;cursor:pointer;font-family:'Nunito'}
.btn-save{background:var(--primary);color:white}
.btn-cancel{background:#f1f5f9;color:var(--text-soft)}

.toast{position:fixed;bottom:20px;left:20px;right:20px;background:var(--success);color:white;padding:12px;border-radius:var(--radius-sm);font-weight:700;z-index:2000;animation:slideUp 0.3s}

.install-prompt{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.install-text{font-size:12px;font-weight:700}
.install-btn{background:white;color:var(--primary);border:none;padding:6px 14px;border-radius:6px;font-weight:800;cursor:pointer;font-size:11px}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-soft)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-weight:700}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-content" id="app">Loading...</div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
const DB_KEY='GrowUp-app-data-v2';
const DEFAULT_ACTS=[
  {emoji:'🌅',name:'Bangun Tidur',time:'05:00',session:'morning',desc:'Bangun & rapikan tempat tidur'},
  {emoji:'🕌',name:'Sholat Subuh',time:'05:15',session:'morning',desc:'Sholat subuh berjamaah'},
  {emoji:'🚿',name:'Mandi Pagi',time:'05:30',session:'morning',desc:'Mandi dan sikat gigi'},
  {emoji:'🍳',name:'Sarapan',time:'06:00',session:'morning',desc:'Makan pagi yang bergizi'},
  {emoji:'👔',name:'Siap ke Sekolah',time:'06:30',session:'morning',desc:'Pakai seragam & rapikan tas'},
  {emoji:'🏫',name:'Berangkat Sekolah',time:'07:00',session:'morning',desc:'Pamit orang tua sebelum pergi'},
  {emoji:'📚',name:'Belajar di Sekolah',time:'07:30',session:'afternoon',desc:'Fokus dan aktif di kelas'},
  {emoji:'🕐',name:'Sholat Dzuhur',time:'12:00',session:'afternoon',desc:'Sholat dzuhur tepat waktu'},
  {emoji:'🏠',name:'Pulang Sekolah',time:'13:00',session:'afternoon',desc:'Ganti baju & cuci tangan'},
  {emoji:'🍽️',name:'Makan Siang',time:'13:30',session:'afternoon',desc:'Makan siang bersama keluarga'},
  {emoji:'😴',name:'Istirahat / Tidur Siang',time:'14:00',session:'afternoon',desc:'Istirahat 1 jam supaya segar'},
  {emoji:'🕒',name:'Sholat Ashar',time:'15:30',session:'afternoon',desc:'Sholat ashar tepat waktu'},
  {emoji:'✏️',name:'Belajar / PR',time:'16:00',session:'evening',desc:'Kerjakan PR dan ulang pelajaran'},
  {emoji:'⚽',name:'Bermain / Olahraga',time:'17:00',session:'evening',desc:'Gerak badan minimal 30 menit'},
  {emoji:'🌙',name:'Sholat Maghrib',time:'18:00',session:'evening',desc:'Sholat maghrib berjamaah'},
  {emoji:'🌃',name:'Sholat Isya',time:'19:00',session:'night',desc:'Sholat isya tepat waktu'},
  {emoji:'🍜',name:'Makan Malam',time:'19:15',session:'night',desc:'Makan malam bersama keluarga'},
  {emoji:'📖',name:'Belajar Malam',time:'19:45',session:'night',desc:'Ulang pelajaran & siap besok'},
  {emoji:'🦷',name:'Sikat Gigi & Cuci Muka',time:'20:30',session:'night',desc:'Bersih-bersih sebelum tidur'},
  {emoji:'🙏',name:'Doa & Tidur',time:'21:00',session:'night',desc:'Berdoa dan tidur yang cukup'},
];

let DB={children:[],activeId:null,activities:{},perDayDone:{},perDayNotes:{}};

function dkey(d){return d.toISOString().slice(0,10)}
function uid(){return '_'+Math.random().toString(36).slice(2,9)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}

function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){alert('Gagal menyimpan data')}}
function load(){try{const raw=localStorage.getItem(DB_KEY);if(raw)DB=JSON.parse(raw);if(!DB.children.length)return;syncDone(new Date())}catch(e){console.log('Load error:',e)}}

function syncDone(d){const cid=DB.activeId;if(!cid)return;const ids=(DB.perDayDone[cid]||{})[dkey(d)]||[];if(DB.activities[cid]){DB.activities[cid]=DB.activities[cid].map(a=>({...a,done:ids.includes(a.id)}))}}

function getDone(d){const ids=(DB.perDayDone[DB.activeId]||{})[dkey(d)]||[];return ids.length}
function getTotalActs(){return(DB.activities[DB.activeId]||[]).length}
function getPct(d){const t=getTotalActs();return t?Math.round(getDone(d)/t*100):0}

function switchChild(id){DB.activeId=id;syncDone(new Date());render()}
function toggleDone(id){const acts=DB.activities[DB.activeId]||[];DB.activities[DB.activeId]=acts.map(a=>a.id===id?{...a,done:!a.done}:a);const key=dkey(new Date());if(!DB.perDayDone[DB.activeId])DB.perDayDone[DB.activeId]={};DB.perDayDone[DB.activeId][key]=acts.filter(a=>a.done).map(a=>a.id);save();render()}

function addChild(){closeModal();const name=prompt('Nama anak:');if(!name)return;const id=uid();DB.children.push({id,name,avatar:'👧'});DB.activities[id]=DEFAULT_ACTS.map((a,i)=>({...a,id:i+1,done:false}));DB.activeId=id;save();render()}

function openModal(modal){
  const backdrop=document.getElementById('modal');
  const content=document.getElementById('modal-content');
  
  if(modal==='addActivity'){
    content.innerHTML=`
      <div class="modal-title">➕ Tambah Kegiatan</div>
      <div class="form-group">
        <label>Nama Kegiatan</label>
        <input id="act-name" placeholder="Contoh: Les Piano..." maxlength="30">
      </div>
      <div class="form-group">
        <label>Waktu (HH:MM)</label>
        <input id="act-time" type="time" value="08:00">
      </div>
      <div class="form-group">
        <label>Emoji</label>
        <input id="act-emoji" placeholder="Pilih emoji..." value="⭐" maxlength="2">
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn btn-save" onclick="saveActivity()">Simpan</button>
      </div>
    `;
  }
  else if(modal==='settings'){
    content.innerHTML=`
      <div class="modal-title">⚙️ Pengaturan</div>
      <button class="btn btn-secondary" onclick="exportData()" style="margin-bottom:8px">📥 Export Data (JSON)</button>
      <button class="btn btn-secondary" onclick="importData()" style="margin-bottom:8px">📤 Import Data (JSON)</button>
      <button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
    `;
  }
  
  backdrop.classList.add('active');
  setTimeout(()=>document.getElementById('act-name')?.focus(),100);
}

function closeModal(){document.getElementById('modal').classList.remove('active')}

function saveActivity(){
  const name=document.getElementById('act-name')?.value.trim();
  const time=document.getElementById('act-time')?.value;
  const emoji=document.getElementById('act-emoji')?.value||'⭐';
  if(!name){alert('Nama kegiatan harus diisi!');return}
  const acts=DB.activities[DB.activeId]||[];
  acts.push({id:Math.max(...acts.map(a=>a.id),0)+1,emoji,name,time,session:'morning',desc:'',done:false});
  acts.sort((a,b)=>toMin(a.time)-toMin(b.time));
  save();
  closeModal();
  render();
  showToast('✅ Kegiatan ditambahkan');
}

function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`GrowUp-backup-${dkey(new Date())}.json`;
  a.click();
  closeModal();
  showToast('✅ Data diexport');
}

function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const imported=JSON.parse(evt.target.result);
        DB=imported;
        save();
        closeModal();
        render();
        showToast('✅ Data diimport');
      }catch(err){
        alert('File tidak valid!');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function showToast(msg){
  const toast=document.createElement('div');
  toast.className='toast';
  toast.textContent=msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),2000);
}

function render(){
  const app=document.getElementById('app');
  
  if(!DB.children.length){
    app.innerHTML=`<div class="empty-state">
      <div class="empty-icon">👨‍👩‍👧</div>
      <div class="empty-text">Belum ada profil anak</div>
      <button class="btn btn-primary" style="margin-top:20px;width:200px" onclick="addChild()">+ Tambah Anak</button>
    </div>`;
    return;
  }

  const ch=DB.children.find(c=>c.id===DB.activeId);
  const acts=(DB.activities[DB.activeId]||[]).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const done=getDone(new Date());
  const total=acts.length;
  const pct=getPct(new Date());

  let html=`<div class="topbar">
    <div class="brand"><div class="brand-logo">⭐</div><span>GrowUp</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="openModal('settings')">⚙️</button>
    </div>
  </div>`;

  html+=`<div class="card">
    <div class="card-title">Progress Hari Ini</div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-num">${done}/${total}</div>
        <div class="stat-label">Selesai</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">${pct}%</div>
        <div class="stat-label">Progress</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">${'⭐'.repeat(Math.ceil(pct/20))}</div>
        <div class="stat-label">Bintang</div>
      </div>
    </div>
  </div>`;

  html+=`<div class="card"><div class="card-title">Pilih Anak</div><div class="profile-row">
    ${DB.children.map(c=>`<div class="profile-chip${c.id===DB.activeId?' active':''}" onclick="switchChild('${c.id}')">
      <div class="profile-avatar">${c.avatar}</div>
      <div class="profile-name">${esc(c.name)}</div>
    </div>`).join('')}
    <div class="profile-chip" onclick="addChild()" style="justify-content:center">
      <div class="profile-avatar">➕</div>
      <div class="profile-name">Tambah</div>
    </div>
  </div></div>`;

  html+=`<div class="card"><div class="card-title">Kegiatan Hari Ini</div>`;
  if(acts.length){
    acts.forEach(a=>{
      html+=`<div class="act-card${a.done?' done':''}" onclick="toggleDone(${a.id})">
        <span class="act-emoji">${a.emoji}</span>
        <div class="act-info">
          <div class="act-name">${esc(a.name)}</div>
          <div class="act-time">${a.time}</div>
        </div>
        <button class="check-btn${a.done?' done':''}" onclick="event.stopPropagation();toggleDone(${a.id})">${a.done?'✓':''}</button>
      </div>`;
    });
  }else{
    html+=`<div style="text-align:center;padding:20px;color:var(--text-soft)">Belum ada kegiatan</div>`;
  }
  html+=`</div>`;

  html+=`<div class="bottom-actions">
    <button class="btn btn-primary" onclick="openModal('addActivity')">+ Kegiatan</button>
  </div>`;

  app.innerHTML=html;
}

// PWA Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>{if(e.request.method==="GET"){e.respondWith(fetch(e.request).catch(()=>new Response("Offline")))}})').catch(e=>console.log('SW error:',e));
}

// Install prompt
if('BeforeInstallPromptEvent' in window){
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
  });
}

load();
render();
setInterval(render,60000);
</script>
</body>
</html>
